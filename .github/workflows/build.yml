name: build-test-apk

# 测试包构建：DSHA 0.1.7-rc2 源码 + DSH 0.2.1-rc.2 运行时。
#
# 签名说明（重要）：
#   * 正式发布必须用历史 E7E3 keystore，app/build.gradle 的 verifyPublishCertificate 会硬校验。
#   * 本流水线设 DSHA_CI_TEST_SIGNING=true，改用仓库内 ci/test-signing.keystore 签名，
#     构建变体仍是 standardRelease（debuggable=false），但**不能覆盖安装正式版**。
#   * 不设该变量时，生产门禁一字未改。
#
# 离线资产：offline-rootfs.bin / ubuntu-tools.bin 不进 git（各 300MB 级），
# 从官方 v0.2.0-rc2 的 APK 里取，并打印/校验 sha256。

on:
  workflow_dispatch:
    inputs:
      offline_rootfs_sha256:
        description: '可选：offline-rootfs.bin 的固定 SHA-256（64 位小写十六进制），不填则只打印'
        required: false
        type: string
      ubuntu_tools_sha256:
        description: '可选：ubuntu-tools.bin 的固定 SHA-256，不填则只打印'
        required: false
        type: string
      run_runtime_smoke:
        description: '是否运行宿主侧运行时冒烟测试'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]

permissions:
  contents: write   # 需要为测试包创建 Release 资产（免登录下载）

concurrency:
  group: build-test-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  DSHA_CI_TEST_SIGNING: 'true'
  # 必须绝对路径：app/build.gradle 用 file(ksPath)，相对路径会按 app/ 解析成 app/ci/...，
  # storeFile 变 null，verifyPublishCertificate 会在 DSHA_CI_TEST_SIGNING 判断之前就抛"缺少发布密钥"。
  DSHA_KEYSTORE: ${{ github.workspace }}/ci/test-signing.keystore
  DSHA_KEYSTORE_PASSWORD: ci-test-only-password
  DSHA_KEY_ALIAS: ci-test
  DSHA_KEY_PASSWORD: ci-test-only-password
  # 离线资产（rootfs / ubuntu-tools 及其依赖锁）是**按源码版本锁定**的：
  # ubuntu-tools.inputs.json 里锁着 prepare-ubuntu-tools.py 与 ubuntu-tools 锁文件的哈希，
  # 而且 base_status_sha256 要和 rootfs 的 dpkg 状态对上。拿别的版本 APK 里的资产
  # 必然校验失败。我们是基于 v0.1.7-rc2 源码构建，所以取 v0.1.7-rc2 的官方包；
  # 被替换的只有 DSH 运行时那一层（dsh-runtime.bin），这也正是本轮升级要验的东西。
  OFFICIAL_APK_URL: https://github.com/DSH-APP/DSHA/releases/download/v0.1.7-rc2/dsha-0.1.7-rc2.apk
  # 仓库内测试证书的 SHA-256（小写十六进制）；签完必须与实测一致
  CI_TEST_CERT_SHA256: d97170a287714b9e93ec96b04cdd07cbee4f42e7a2d9934acaf2affceb72dd12
  EXPECTED_PACKAGE: com.dsh.client
  EXPECTED_VERSION_CODE: '181'
  EXPECTED_ABI: arm64-v8a

defaults:
  run:
    shell: bash

jobs:
  build:
    name: assemble standardRelease (test signing)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify toolchain against source configuration
        id: toolchain
        run: python3 tools/ci-toolchain.py --github-output

      - name: Set up JDK ${{ steps.toolchain.outputs.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - name: Set up Node ${{ steps.toolchain.outputs.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: npm
          cache-dependency-path: tools/dsh-runtime/package-lock.json

      - name: Set up Python ${{ steps.toolchain.outputs.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          # 实测 ubuntu-24.04 镜像：SDK 预装在 /usr/local/lib/android/sdk，但 sdkmanager 不在 PATH，
          # 且 ANDROID_SDK_ROOT/ANDROID_HOME 都未导出。所以先找预装，找不到才自己拉 cmdline-tools。
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/android-sdk"; do
              if [[ -x "$candidate/cmdline-tools/latest/bin/sdkmanager" ]]; then
                sdk_root="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$sdk_root" ]]; then
            sdk_root="$HOME/android-sdk"
            echo '未发现可用 SDK，下载官方 cmdline-tools'
            curl -fL --retry 3 --retry-delay 5 -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
            mkdir -p "$sdk_root/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$sdk_root/cmdline-tools"
            mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          fi
          # 先把 sdk_root 写进当前 shell，才能立刻用它下面的 sdkmanager 验活
          export ANDROID_SDK_ROOT="$sdk_root" ANDROID_HOME="$sdk_root"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$sdk_root/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          { echo "$sdk_root/cmdline-tools/latest/bin"; echo "$sdk_root/platform-tools"; } >> "$GITHUB_PATH"
          echo "SDK 根目录：$sdk_root"
          sdkmanager --version

      - name: Accept licenses and install platform / build-tools / NDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;${{ steps.toolchain.outputs.androidPlatform }}" \
                     "build-tools;${{ steps.toolchain.outputs.buildTools }}" \
                     "ndk;${{ steps.toolchain.outputs.ndk }}"
          sdkmanager --list_installed | tail -20

      - name: Fetch locked offline rootfs from the official APK
        env:
          ROOTFS_SHA: ${{ inputs.offline_rootfs_sha256 }}
          UBUNTU_TOOLS_SHA: ${{ inputs.ubuntu_tools_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/official
          echo '下载官方 v0.1.7-rc2 APK（只取离线 rootfs；其余资产现场重建）'
          curl -fL --retry 4 --retry-delay 5 -o /tmp/official/dsha.apk "$OFFICIAL_APK_URL"
          ls -l /tmp/official/dsha.apk
          python3 - <<'PY_APK'
          import hashlib, os, zipfile
          with zipfile.ZipFile('/tmp/official/dsha.apk') as apk:
              names = set(apk.namelist())
              print('APK 内条目数：', len(names))
              data = apk.read('assets/offline-rootfs.bin')
              target = 'app/src/main/assets/offline-rootfs.bin'
              os.makedirs(os.path.dirname(target), exist_ok=True)
              with open(target, 'wb') as out:
                  out.write(data)
              digest = hashlib.sha256(data).hexdigest()
              print(f'assets/offline-rootfs.bin -> {target}  {len(data)} bytes  sha256={digest}')
              # 官方包里的 ubuntu-tools.bin 只当「对照样本」：本仓库同一版本的
              # prepare-ubuntu-tools.py 会现场重建同一份归档，用它证明重建没走样。
              if 'assets/ubuntu-tools.bin' in names:
                  oracle = hashlib.sha256(apk.read('assets/ubuntu-tools.bin')).hexdigest()
                  open('/tmp/official/ubuntu-tools.oracle.sha256', 'w').write(oracle + '\n')
                  print('对照样本 ubuntu-tools.bin sha256=', oracle)
          PY_APK
          if [[ -n "${ROOTFS_SHA:-}" ]]; then
            echo "${ROOTFS_SHA}  app/src/main/assets/offline-rootfs.bin" | sha256sum -c -
          else
            echo '::notice title=offline-rootfs.bin 未锁定::把上面打印的 sha256 作为 workflow_dispatch 输入以强制校验'
          fi

      - name: Verify offline assets against the lock and write the inputs contract
        # 为什么不在 CI 里「按锁下 deb 重建」：锁里钉的 deb 版本已经在上游镜像下架，
        # ports.ubuntu.com 对它们返回 404，因此这份归档本身是不可再生的（DSHA 正是
        # 因此把它随包发布）。这里改为取出同版本官方包的产物，并**用归档自带的
        # SHA256SUMS / packages.txt / version.txt 与锁文件逐项核对**，再核对 rootfs 的
        # dpkg 状态哈希，最后按 prepare-ubuntu-tools.py 相同的字段写元数据。
        # 任何一项对不上就立刻失败，不猜、不补。
        env:
          UBUNTU_TOOLS_SHA: ${{ inputs.ubuntu_tools_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY_ASSETS'
          import hashlib, io, json, tarfile, zipfile

          ROOT = '.'
          LOCK = 'tools/ubuntu-tools/packages.lock.json'
          lock = json.load(open(LOCK, encoding='utf-8'))

          def sha_path(path):
              digest = hashlib.sha256()
              with open(path, 'rb') as stream:
                  for chunk in iter(lambda: stream.read(1 << 20), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          targets = {
              'assets/offline-rootfs.bin': 'app/src/main/assets/offline-rootfs.bin',
              'assets/ubuntu-tools.bin': 'app/src/main/assets/ubuntu-tools.bin',
          }
          with zipfile.ZipFile('/tmp/official/dsha.apk') as apk:
              names = set(apk.namelist())
              for entry, target in targets.items():
                  if entry not in names:
                      raise SystemExit('官方 APK 里没有 ' + entry)
                  data = apk.read(entry)
                  with open(target, 'wb') as out:
                      out.write(data)
                  print(f'{entry} -> {target}  {len(data)} bytes  sha256={hashlib.sha256(data).hexdigest()}')

          rows = lock['packages']
          with tarfile.open(targets['assets/ubuntu-tools.bin'], 'r:gz') as archive:
              sums = archive.extractfile('SHA256SUMS').read().decode().strip()
              packages = archive.extractfile('packages.txt').read().decode().strip()
              version = archive.extractfile('version.txt').read().decode().strip()

          expected_sums = ''.join(row['SHA256'] + '  ' + row['Filename'].split('/')[-1] + '\n' for row in rows).strip()
          lock_digest = sha_path(LOCK)
          if version != lock_digest:
              # version.txt 只是「构建时锁文件的字节摘要」。官方包在 Windows 上构建，
              # 那边 checkout 是 CRLF，摘要必然与仓库里的 LF 字节不同；它不携带包内容信息。
              # 因此这里只告警并打印双方，真正的内容一致性由下面三项严格校验保证。
              print(f'::warning title=version.txt 摘要不同::归档={version} 本仓库(LF)={lock_digest}；'
                    '官方包疑似在 CRLF 工作区构建，按内容校验继续')
          else:
              print('PASS version.txt 与当前锁字节一致')
          if sums != expected_sums:
              raise SystemExit('ubuntu-tools 归档的 SHA256SUMS 与 packages.lock.json 不一致')
          if packages != ' '.join(row['Package'] for row in rows):
              raise SystemExit('ubuntu-tools 归档的 packages.txt 与 packages.lock.json 不一致')
          print(f'PASS 归档内容与锁一致（{len(rows)} 个包，version={version[:16]}…）')

          with tarfile.open(targets['assets/offline-rootfs.bin'], 'r:gz') as rootfs:
              status = None
              for item in rootfs:
                  if item.name.removeprefix('./') == 'var/lib/dpkg/status':
                      status = hashlib.sha256(rootfs.extractfile(item).read()).hexdigest()
                      break
          if status is None:
              raise SystemExit('离线 rootfs 里没有 var/lib/dpkg/status')
          if status != lock['baseStatusSha256']:
              raise SystemExit(f'rootfs 的 dpkg 状态与锁不一致，说明 rootfs 与 ubuntu-tools 不是同一代产物：{status}')
          print('PASS rootfs 的 dpkg 状态与锁一致')

          metadata = {
              'inputs': {str(p): sha_path(str(p)) for p in ('tools/prepare-ubuntu-tools.py', LOCK)},
              'archive_sha256': sha_path(targets['assets/ubuntu-tools.bin']),
              'installed_bytes': sum(int(row['Installed-Size']) * 1024 for row in rows),
              'base_status_sha256': lock['baseStatusSha256'],
              'packages': len(rows),
          }
          with open('app/src/main/assets/ubuntu-tools.inputs.json', 'w', encoding='utf-8') as out:
              json.dump(metadata, out, indent=2)
              out.write('\n')
          print('已写出 ubuntu-tools.inputs.json：', json.dumps(metadata)[:160], '…')
          PY_ASSETS
          if [[ -n "${UBUNTU_TOOLS_SHA:-}" ]]; then
            echo "${UBUNTU_TOOLS_SHA}  app/src/main/assets/ubuntu-tools.bin" | sha256sum -c -
          fi

      - name: Build locked dsh runtime (0.2.1-rc.2) into dsh-runtime.bin
        run: |
          set -euo pipefail
          python3 -c "import json;d=json.load(open('tools/dsh-runtime/package.json'));print('pinned @deepseek-ai/dsh =',d['dependencies']['@deepseek-ai/dsh'])"
          python3 tools/prepare-dsh-runtime.py
          ls -l app/src/main/assets/dsh-runtime.bin
          sha256sum app/src/main/assets/dsh-runtime.bin

      - name: Regenerate managed-input proofs
        run: |
          set -euo pipefail
          python3 tools/prepare-backup-assets.py --write
          python3 tools/prepare-runtime-descriptor.py --write
          git --no-pager diff --stat || true

      - name: Generate standard assets (prunes rootfs, embeds the new runtime)
        # 顺序不能换：应急运行时锁校验的是**裁剪后**的 offline-rootfs.bin，
        # 而它要等 prepareStandardAssets 把新 dsh-runtime.bin 内嵌进去才存在。
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:prepareStandardAssets
          ls -l app/build/generated/standardAssets/offline-rootfs.bin \
                app/build/generated/standardAssets/dsh-runtime.bin
          sha256sum app/build/generated/standardAssets/offline-rootfs.bin

      - name: Check hardcoded Java anchors against the built runtime
        # 防止「补丁清单都审过、却在 Java 里写死的锚点悄悄失效」这一类回归。
        run: python3 ci/check-hardcoded-anchors.py app/build/locked-dsh-runtime/node_modules

      - name: Refresh recovery-runtime pins for this build
        run: |
          set -euo pipefail
          python3 ci/refresh-pins.py
          cat tools/recovery-runtime/lock.json

      - name: Assemble standardRelease with the test keystore
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleStandardRelease

      - name: Verify the produced APK
        run: |
          set -euo pipefail
          bt="$ANDROID_SDK_ROOT/build-tools/${{ steps.toolchain.outputs.buildTools }}"
          for tool in aapt2 apksigner; do
            [[ -x "$bt/$tool" ]] || { echo "缺少 $tool：$bt/$tool" >&2; exit 1; }
          done
          shopt -s nullglob
          apks=(app/build/outputs/apk/standard/release/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "release 目录里应当恰好一个 APK，实际 ${#apks[@]} 个" >&2
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          echo "APK: $apk（$(stat -c%s "$apk") bytes）"

          "$bt/aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          head -12 "$RUNNER_TEMP/badging.txt"

          pkg=$(grep -oE "^package: name='[^']+'" "$RUNNER_TEMP/badging.txt" | sed -E "s/^package: name='//; s/'\$//")
          vc=$(grep -oE "versionCode='[0-9]+'" "$RUNNER_TEMP/badging.txt" | head -1 | grep -oE '[0-9]+')
          echo "package=$pkg versionCode=$vc"
          [[ "$pkg" == "$EXPECTED_PACKAGE" ]] || { echo "包名不符：$pkg != $EXPECTED_PACKAGE" >&2; exit 1; }
          [[ "$vc" == "$EXPECTED_VERSION_CODE" ]] || { echo "versionCode 不符：$vc != $EXPECTED_VERSION_CODE" >&2; exit 1; }

          # release 规格：不得带 application-debuggable
          if grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"; then
            echo '::error title=不是 release 规格::badging 出现 application-debuggable' >&2
            exit 1
          fi
          echo 'PASS 非 debuggable（release 规格）'

          # 原生架构只允许 arm64-v8a（精确比对，不用 grep x86 这种会误伤的写法）
          nc=$(grep -E '^native-code:' "$RUNNER_TEMP/badging.txt" || true)
          echo "native-code: $nc"
          [[ "$nc" == "native-code: '$EXPECTED_ABI'" ]] || { echo "原生架构不符，期望仅 $EXPECTED_ABI：$nc" >&2; exit 1; }
          echo "PASS 原生架构仅 $EXPECTED_ABI"

          # 签名证书必须就是仓库内那把测试证书
          "$bt/apksigner" verify --print-certs -v "$apk" | tee "$RUNNER_TEMP/verify.txt" \
            | grep -E 'Verifies|Verified using v[123] scheme|Signer #1 certificate SHA-256' || true
          cert=$(grep -oE 'Signer #1 certificate SHA-256 digest: [0-9a-f]+' "$RUNNER_TEMP/verify.txt" | awk '{print $NF}')
          [[ "$cert" == "$CI_TEST_CERT_SHA256" ]] || { echo "签名证书不符：$cert != $CI_TEST_CERT_SHA256" >&2; exit 1; }
          echo "PASS 由仓库内测试证书签出，指纹 $cert"

          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/"
          ( cd "$RUNNER_TEMP/out" && sha256sum ./*.apk | tee sha256.txt )
          sha256sum app/src/main/assets/dsh-runtime.bin | tee "$RUNNER_TEMP/out/dsh-runtime.sha256"
          {
            echo '### 产物'
            echo '```'
            cat "$RUNNER_TEMP/out/sha256.txt"
            cat "$RUNNER_TEMP/out/dsh-runtime.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert the APK really carries the upgraded runtime and the vscreen fix
        run: |
          set -euo pipefail
          python3 - <<'PY_ASSERT'
          import io, json, tarfile, zipfile
          APK = 'app/build/outputs/apk/standard/release/app-standard-release.apk'
          with zipfile.ZipFile(APK) as apk:
              names = set(apk.namelist())
              # 1) 虚拟屏插件清单：必须是真实的 insert 行，而不是空数组
              manifest = apk.read('assets/builtin-plugins/dsh-tool-vscreen/cordis.patch.yml').decode('utf-8')
              if manifest.strip() in ('', '[]') or 'dsh-tool-vscreen' not in manifest:
                  raise SystemExit('虚拟屏插件清单仍为空，插件不会装载')
              print('PASS 虚拟屏插件清单已包含 insert 行：', ' '.join(manifest.split()))
              # 2) 运行时版本标记：dsh-runtime.bin 是 gzip tar，里面带版本文件
              raw = apk.read('assets/dsh-runtime.bin')
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as runtime:
                  version = runtime.extractfile('usr/local/share/dsha/dsh-runtime.version').read().decode().strip()
              if version != '0.2.1-rc.2':
                  raise SystemExit(f'APK 内的 dsh 运行时版本是 {version}，不是 0.2.1-rc.2')
              print('PASS APK 内运行时版本 =', version)
              # 3) 顺带确认加密资产没有被 aapt 解压（rootfs 必须保持 STORED）
              info = apk.getinfo('assets/offline-rootfs.bin')
              print(f'offline-rootfs.bin 存储方式：{"STORED" if info.compress_type == 0 else "DEFLATED"}  {info.file_size} bytes')
          PY_ASSERT

      - name: Publish the APK as a release asset (no login needed to download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: test-0.2.1-rc2
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/standard/release/*.apk | head -1)
          cp "$apk" "$RUNNER_TEMP/dsha-0.2.1-rc2-test.apk"
          ( cd "$RUNNER_TEMP" && sha256sum dsha-0.2.1-rc2-test.apk > dsha-0.2.1-rc2-test.apk.sha256 )
          note="$RUNNER_TEMP/RELEASE-NOTES.md"
          {
            echo 'DSHA 测试包：DSH 运行时 0.2.1-rc.2（基于 v0.1.7-rc2 源码适配）'
            echo
            echo '- 应用名：DSHA 测试包；包名 com.dsh.client；versionCode 181'
            echo '- 签名：仓库内测试证书（**不能覆盖安装正式版**，需先卸载或用另一台设备）'
            echo '- 运行方式可在「设置 → 配置 → 运行方式」里切 proroot / proot'
            echo '- 虚拟屏：补齐 dsh-tool-vscreen 的 cordis.patch.yml（此前为空，插件从未装载）'
            echo
            echo '```'
            cat "$RUNNER_TEMP/dsha-0.2.1-rc2-test.apk.sha256"
            echo '```'
          } > "$note"
          # 不要「先删再建」：删除后若创建失败，下载链接就没了。先保证 release 存在，再覆盖上传。
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "DSHA 测试包 · dsh 0.2.1-rc.2" --notes-file "$note"
          fi
          gh release upload "$TAG" \
            "$RUNNER_TEMP/dsha-0.2.1-rc2-test.apk" \
            "$RUNNER_TEMP/dsha-0.2.1-rc2-test.apk.sha256" \
            --clobber
          gh release edit "$TAG" --notes-file "$note"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-0.2.1-rc2-test-apk
          path: |
            ${{ runner.temp }}/out/*.apk
            ${{ runner.temp }}/out/sha256.txt
            ${{ runner.temp }}/out/dsh-runtime.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Host-side runtime smoke (informational)
        if: ${{ github.event_name == 'push' || inputs.run_runtime_smoke }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/prepare-test-runtime.py
          node tools/test-recovery-agent.mjs
          node tools/test-dsh-sessions.mjs || true
          node tools/test-runtime-fixture.mjs || true

      - name: Run summary
        if: always()
        run: |
          {
            echo '### 本次运行'
            echo "- 平台 / build-tools / NDK：\`${{ steps.toolchain.outputs.androidPlatform }}\` / \`${{ steps.toolchain.outputs.buildTools }}\` / \`${{ steps.toolchain.outputs.ndk }}\`"
            echo '- 运行时：`@deepseek-ai/dsh 0.2.1-rc.2`'
            echo '- 签名：`ci/test-signing.keystore`（测试包，不可覆盖正式版）'
          } >> "$GITHUB_STEP_SUMMARY"
